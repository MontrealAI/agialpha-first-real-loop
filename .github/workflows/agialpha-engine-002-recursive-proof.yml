name: AGI ALPHA Engine 002 / Measured Recursive Machine-Labor Proof

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        required: false
        default: repo_evidence_ops
      parent_mandates:
        description: Parent mandates
        required: false
        default: '2'
      child_mandates:
        description: Child mandates
        required: false
        default: '6'
      min_lift_pct:
        description: Minimum lift percent
        required: false
        default: '15'
      publish_engine_tab:
        description: Publish generated engine tab artifacts
        required: false
        default: 'true'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  measured-recursive-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SecureRails checks
        run: |
          if [ -f scripts/secure_rails_claim_boundary_check.py ]; then python scripts/secure_rails_claim_boundary_check.py .; fi
          if [ -f scripts/secure_rails_no_automerge_check.py ]; then python scripts/secure_rails_no_automerge_check.py .; fi
      - name: Run recursive proof
        run: |
          python -m agialpha_engine run-recursive-proof --repo-root . --registry agialpha_engine_registry --out agialpha-engine-proof-runs/engine-002 --suite "${{ inputs.suite || 'repo_evidence_ops' }}" --parent-mandates "${{ inputs.parent_mandates || '2' }}" --child-mandates "${{ inputs.child_mandates || '6' }}" --min-lift-pct "${{ inputs.min_lift_pct || '15' }}"
      - name: Replay
        run: python -m agialpha_engine replay --run agialpha-engine-proof-runs/engine-002
      - name: Falsification audit
        run: python -m agialpha_engine falsification-audit --run agialpha-engine-proof-runs/engine-002
      - name: Validate
        run: python -m agialpha_engine validate --run agialpha-engine-proof-runs/engine-002
      - name: Emit manifest
        run: python -m agialpha_engine emit-manifest --run agialpha-engine-proof-runs/engine-002 --out agialpha-engine-proof-runs/engine-002/evidence-run-manifest.json
      - name: Build generated data
        run: python -m agialpha_engine build-data --registry agialpha_engine_registry --out docs/_generated/agialpha-engine
      - uses: actions/upload-artifact@v4
        with:
          name: agialpha-engine-002-recursive-proof
          path: |
            agialpha-engine-proof-runs/engine-002
            docs/_generated/agialpha-engine
